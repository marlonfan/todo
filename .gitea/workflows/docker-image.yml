name: Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGE:-}" ]; then
            echo "DOCKERHUB_IMAGE is empty"
            exit 1
          fi
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is empty"
            exit 1
          fi

          SHORT_SHA="$(echo "${SHA}" | cut -c1-7)"
          TAG_SHA="sha-${SHORT_SHA}"

          if [ "${REF_TYPE}" = "tag" ]; then
            TAG_MAIN="${REF_NAME}"
          elif [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            TAG_MAIN="latest"
          else
            TAG_MAIN="${REF_NAME}"
          fi

          if command -v docker >/dev/null 2>&1; then
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            docker build -t "${IMAGE}:${TAG_MAIN}" -t "${IMAGE}:${TAG_SHA}" .
            docker push "${IMAGE}:${TAG_MAIN}"
            docker push "${IMAGE}:${TAG_SHA}"
            exit 0
          fi

          echo "docker not found, fallback to buildah"
          if ! command -v buildah >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends buildah
              else
                apt-get update
                apt-get install -y --no-install-recommends buildah
              fi
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache buildah
            else
              echo "No supported package manager found to install buildah"
              exit 1
            fi
          fi

          echo "${DOCKERHUB_TOKEN}" | buildah login -u "${DOCKERHUB_USERNAME}" --password-stdin docker.io
          buildah --storage-driver=vfs bud --isolation=chroot -t "${IMAGE}:${TAG_MAIN}" -t "${IMAGE}:${TAG_SHA}" .
          buildah --storage-driver=vfs push "${IMAGE}:${TAG_MAIN}" "docker://${IMAGE}:${TAG_MAIN}"
          buildah --storage-driver=vfs push "${IMAGE}:${TAG_SHA}" "docker://${IMAGE}:${TAG_SHA}"
