name: Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push
        env:
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGE:-}" ]; then
            echo "DOCKERHUB_IMAGE is empty"
            exit 1
          fi

          SHORT_SHA="$(echo "${SHA}" | cut -c1-7)"
          TAG_SHA="sha-${SHORT_SHA}"

          if [ "${REF_TYPE}" = "tag" ]; then
            TAG_MAIN="${REF_NAME}"
          elif [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            TAG_MAIN="latest"
          else
            TAG_MAIN="${REF_NAME}"
          fi

          docker build -t "${IMAGE}:${TAG_MAIN}" -t "${IMAGE}:${TAG_SHA}" .
          docker push "${IMAGE}:${TAG_MAIN}"
          docker push "${IMAGE}:${TAG_SHA}"
