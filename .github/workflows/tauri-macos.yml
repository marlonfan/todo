name: Build macOS Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL'
        required: false
        default: 'https://todo.marlon.life/api'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://todo.marlon.life/api' }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        # Frontend already built above with the correct VITE_API_BASE_URL.
        # Override beforeBuildCommand to empty so Tauri doesn't rebuild it.
        run: cargo tauri build --config '{"build":{"beforeBuildCommand":""}}'
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Todo-macOS
          path: |
            src-tauri/target/release/bundle/macos/Todo.app
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
