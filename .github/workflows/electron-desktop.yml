name: Build Electron Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL'
        required: false
        default: 'https://todo.marlon.life/api'
      release_tag:
        description: 'Release tag for manual runs, for example v0.1.5. Leave empty to use electron/package.json version.'
        required: false
        default: ''
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: Todo-Electron-macOS
            paths: |
              electron/dist/*.dmg
              electron/dist/*.zip
              electron/dist/*.blockmap
              electron/dist/latest-mac.yml
          - os: windows-latest
            artifact: Todo-Electron-Windows
            paths: |
              electron/dist/*.exe
              electron/dist/*.msi
              electron/dist/*.blockmap
              electron/dist/latest.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Resolve Electron version
        id: electron-version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
        run: |
          version=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${RELEASE_TAG_INPUT}"
          fi

          if [[ -n "${tag}" ]]; then
            if [[ "${tag}" != v* ]]; then
              echo "::error::Release tag must start with v, for example v0.1.5."
              exit 1
            fi
            version="${tag#v}"
            current_version="$(node -p "require('./package.json').version")"
            if [[ "${current_version}" != "${version}" ]]; then
              npm version "${version}" --no-git-tag-version
            fi
          else
            version="$(node -p "require('./package.json').version")"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
        working-directory: electron

      - name: Build Electron app
        run: npm run build -- --publish never
        working-directory: electron
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://todo.marlon.life/api' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build-electron
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${RELEASE_TAG_INPUT}"
            if [[ -z "${tag}" ]]; then
              version="$(node -p "require('./electron/package.json').version")"
              tag="v${version}"
            elif [[ "${tag}" != v* ]]; then
              echo "::error::Release tag must start with v, for example v0.1.5."
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=Todo Desktop ${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || false }}
          fail_on_unmatched_files: true
          files: release-assets/*
