name: Build Electron Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL'
        required: false
        default: 'https://todo.marlon.life/api'
      release_tag:
        description: 'Release tag for manual runs. Leave empty to use electron-v<version>-<run_number>.'
        required: false
        default: ''
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: Todo-Electron-macOS
            paths: |
              electron/dist/*.dmg
          - os: windows-latest
            artifact: Todo-Electron-Windows
            paths: |
              electron/dist/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Build Electron app
        run: npm run build
        working-directory: electron
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://todo.marlon.life/api' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build-electron
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
            if [[ -z "${tag}" ]]; then
              version="$(node -p "require('./electron/package.json').version")"
              tag="electron-v${version}-${GITHUB_RUN_NUMBER}"
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=Todo Desktop ${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || false }}
          fail_on_unmatched_files: true
          files: release-assets/*
